version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Keep declarations aligned with the supported Node 20 runtime floor.
      # Like the TypeScript exclusion below, this also suppresses security PRs
      # requiring a major bump; review such advisories manually.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # No published typescript-eslint accepts TypeScript 7 — its peer range is
      # still `>=4.8.4 <6.1.0` as of 8.71.0, so a major bump fails `npm ci` with
      # ERESOLVE before lint/build/test run. Remove this rule as the first step
      # of issue #95.
      #
      # ACCEPTED RESIDUAL RISK: `ignore` has no `applies-to` key (that parameter
      # exists only on `groups`), so this cannot be scoped to version updates.
      # Per GitHub's Dependabot options reference, `ignore` also changes how
      # SECURITY-update PRs are created, so were a CVE to need a TypeScript major
      # bump, this rule would suppress that PR too.
      #
      # The grouped security-update policy (#99) retains this exclusion because
      # TypeScript 7 still cannot resolve against typescript-eslint 8.71.0
      # (peer >=4.8.4 <6.1.0, checked 2026-10-02). A security fix needing a
      # TypeScript major therefore needs manual review until #95 unparks.
      # TypeScript is a devDependency, but it runs during builds; absence from
      # the published runtime package does not eliminate build-time exposure.
      # Minor and patch updates are unaffected either way. Revisit via #95.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Vitest 5 requires Node `^22.12.0 || ^24.0.0 || >=26.0.0` and declares an
      # `@types/node` peer of `^22.0.0 || >=24.0.0` (5.0.3 through 5.0.5,
      # checked 2026-10-23). This package supports Node 20 and caps
      # `@types/node` at ^20, so a Vitest 5 bump fails `npm ci` with ERESOLVE
      # (#137). Stay on Vitest 4 until the Node 20 floor is raised, then drop
      # this rule. Like the rules above, it also suppresses security-update PRs
      # that need a Vitest major; review such advisories manually. Vitest is a
      # devDependency that runs only in the test step.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        update-types:
          - minor
          - patch
